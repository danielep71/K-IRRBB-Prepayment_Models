version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: release/0.1.0
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Rome
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(actions)
    labels:
      - ci
      - P3
    assignees:
      - danielep71
