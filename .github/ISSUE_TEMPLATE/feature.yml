name: "Feature or model improvement"
description: "Define an auditable capability and testable acceptance criteria."
title: "[Feature]: "
labels: ["enhancement", "P2"]
assignees: ["danielep71"]
body:
  - type: dropdown
    id: area
    attributes:
      label: "Area"
      options:
        - "Prepayment assumptions / CPR / SMM"
        - "Loan data and cash-flow contracts"
        - "Calibration and scenarios"
        - "Backtesting"
        - "Workbook / downstream ALM platform export"
        - "Repository and CI"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "Problem / user need"
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: "Proposed observable behavior (units, bounds, source)"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives considered"
      description: "Optional. Other ways to meet the need, doing nothing included, and why you prefer the proposed behavior."
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance checklist"
      placeholder: "- [ ] Independent numerical result
- [ ] Regression test
- [ ] Failure behavior"
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: "Non-goals"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies"
      description: "Issues or pull requests this needs first (#N), a line starting External condition: (for example External condition: Windows Excel host access), or None. Label the issue blocked while a named prerequisite is open or an external condition holds; triage reports a mismatch."
      value: "None."
    validations:
      required: true
  - type: input
    id: target_end_date
    attributes:
      label: "Target end date"
      description: "YYYY-MM-DD, before the milestone's due date."
      placeholder: "YYYY-MM-DD"
    validations:
      required: true
