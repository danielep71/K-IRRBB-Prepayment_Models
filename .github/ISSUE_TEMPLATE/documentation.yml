name: "Documentation improvement"
description: "Correct or extend authoritative project documentation."
title: "[Docs]: "
labels: ["documentation", "P3"]
assignees: ["danielep71"]
body:
  - type: input
    id: location
    attributes:
      label: "Location"
      description: "File and section, for example docs/methodology/DATA_CONTRACT.md, section Errors."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "Problem"
      description: "What is wrong, missing, out of date or unclear."
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: "Proposed correction"
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: "Supporting source"
      description: "The specification, decision, code or external source that supports the correction. Cite it; do not copy licensed text."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance criteria"
      description: "Verifiable conditions that show the document is correct."
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: "Validation"
      description: "How the correction will be checked: for example python tools/check.py, the link check, or a review against the cited source."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies"
      description: "Issues or pull requests this needs first (#N), a line starting External condition: (for example External condition: Windows Excel host access), or None. Label the issue blocked while a named prerequisite is open or an external condition holds; triage reports a mismatch."
      value: "None."
    validations:
      required: true
  - type: input
    id: target_end_date
    attributes:
      label: "Target end date"
      description: "YYYY-MM-DD, before the milestone's due date."
      placeholder: "YYYY-MM-DD"
    validations:
      required: true
