name: "Documentation improvement"
description: "Correct or extend authoritative project documentation."
title: "[Docs]: "
labels: ["documentation", "P3"]
assignees: ["danielep71"]
body:
  - type: textarea
    id: issue
    attributes:
      label: "Affected document and discrepancy"
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: "Proposed improvement and acceptance criteria"
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies"
      description: "Issues or pull requests this needs first (#N), an external condition, or None. Label the issue blocked while a named prerequisite is open; triage reports a mismatch."
      value: "None."
    validations:
      required: true
  - type: input
    id: target_end_date
    attributes:
      label: "Target end date"
      description: "YYYY-MM-DD, before the milestone's due date."
      placeholder: "YYYY-MM-DD"
    validations:
      required: true
