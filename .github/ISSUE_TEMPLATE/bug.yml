name: "Bug report"
description: "Report a reproducible defect with synthetic evidence."
title: "[Bug]: "
labels: ["bug", "P2"]
assignees: ["danielep71"]
body:
  - type: markdown
    attributes:
      value: "Use synthetic data only; report vulnerabilities privately."
  - type: input
    id: commit
    attributes:
      label: "Exact commit SHA"
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: "Affected component"
      options:
        - "Prepayment assumptions / CPR / SMM"
        - "Loan data and cash-flow contracts"
        - "Calibration and scenarios"
        - "Backtesting"
        - "Workbook integration"
        - "Repository tooling"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "Synthetic reproduction"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected result and independent source"
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: "Observed result and impact"
    validations:
      required: true
