name: "Bug report"
description: "Report a reproducible defect with synthetic evidence."
title: "[Bug]: "
labels: ["bug", "P2"]
assignees: ["danielep71"]
body:
  - type: markdown
    attributes:
      value: "Use synthetic data only; report vulnerabilities privately."
  - type: input
    id: commit
    attributes:
      label: "Exact commit SHA"
    validations:
      required: true
  - type: dropdown
    id: model
    attributes:
      label: "Affected component"
      options:
        - "Prepayment assumptions / CPR / SMM"
        - "Loan data and cash-flow contracts"
        - "Calibration and scenarios"
        - "Backtesting"
        - "Workbook integration"
        - "Repository tooling"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "Synthetic reproduction"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected result and independent source"
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: "Observed result and impact"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: "Evidence, workaround and recovery"
      description: "Optional. Further evidence of the defect, such as logs or screenshots with synthetic data; a workaround while it is open; and how to recover affected results or files, for example which outputs to recompute."
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: "Host environment"
      description: "Excel/Office build and update channel, 32- or 64-bit, and Windows version. For repository tooling, the Python or Node.js version, or Not host-specific."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance criteria"
      description: "Verifiable conditions that show the defect is fixed."
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: "Validation"
      description: "The checks that will prove the fix: for example python tools/check.py, a registered test case with its expected file, or an Excel run on the exact commit."
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: "Dependencies"
      description: "Issues or pull requests this needs first (#N), a line starting External condition: (for example External condition: Windows Excel host access), or None. Label the issue blocked while a named prerequisite is open or an external condition holds; triage reports a mismatch."
      value: "None."
    validations:
      required: true
  - type: input
    id: target_end_date
    attributes:
      label: "Target end date"
      description: "YYYY-MM-DD, before the milestone's due date."
      placeholder: "YYYY-MM-DD"
    validations:
      required: true
