# ---------------------------------------------------------------------------
# Daily traffic export
#
#   Reads the GitHub traffic API for this repository and merges a daily
#   snapshot into CSV files on the orphan `traffic-history` branch, which the
#   first run creates, with tools/traffic_history.py. It also writes
#   data/badges/clones.json, visitors.json and visits.json there: shields.io
#   endpoints for README badges, readable because the repository is public.
#   When views spike, stars or forks increase, or a new referrer appears, the
#   alert job opens one issue for that day. Clones never raise an alert: every
#   workflow checkout of this repository counts as a clone.
#
#   Adapted from K-IRRBB-NMDs at 973501c82f2f9011acfdc9d741ab2af0132cb96c.
#
#   Data retention
#     GitHub retains traffic data for 14 days only. This workflow keeps a
#     longer history. The `traffic-history` branch is visible to anyone who
#     can read this repository; it holds the aggregate counts GitHub already
#     shows repository admins (views, clones, referrers, popular paths) and
#     no information about individual visitors.
#
#   Credentials
#     The traffic API needs Administration: read, which the workflow token
#     cannot have. A dedicated GitHub App with only that permission issues an
#     installation token for this repository, which expires after an hour and
#     is revoked when the job ends, so nothing needs rotating. Its client ID is
#     the variable TRAFFIC_APP_CLIENT_ID and its private key the secret
#     TRAFFIC_APP_PRIVATE_KEY, both in the `analytics` environment, whose
#     deployment branches are limited to main. Only the token step receives
#     the key and only the fetch step the token; neither runs repository code.
#     See docs/TRAFFIC.md.
#
#   Permissions
#     collect  contents: write, to push the history; the only job with the
#              analytics environment.
#     alert    issues: write, to open the alert issue; it declares no
#              environment, so it never receives the App's key or token.
#
#   Scope
#     This is repository analytics, not CI. It compiles nothing, runs no
#     tests, and must never be extended to do so. Software quality is
#     static-checks.yml. Checkouts never persist credentials. Only the push
#     step receives the built-in write token; jobs run only from main.
# ---------------------------------------------------------------------------

name: Daily traffic export

on:
  schedule:
    # Daily, off the hour; GitHub delays scheduled runs most on the hour.
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-traffic-${{ github.repository }}
  cancel-in-progress: false

jobs:
  collect:
    name: Collect GitHub traffic
    # Manual dispatch can select any branch. Run only the default branch's
    # reviewed copy; scheduled events already run on the default branch.
    # The analytics environment independently allows only main.
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    environment:
      name: analytics
      deployment: false
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.18"

      - name: Prepare traffic-history branch
        run: |
          set -euo pipefail
          git init -q history
          cd history
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin traffic-history > /dev/null; then
            git fetch -q origin traffic-history
            git checkout -q -b traffic-history FETCH_HEAD
          else
            git checkout -q --orphan traffic-history
          fi
          mkdir -p data

      - name: Check the traffic App configuration
        env:
          CLIENT_ID: ${{ vars.TRAFFIC_APP_CLIENT_ID }}
          HAS_KEY: ${{ secrets.TRAFFIC_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error::TRAFFIC_APP_CLIENT_ID or TRAFFIC_APP_PRIVATE_KEY is not set in the analytics environment (docs/TRAFFIC.md)"
            exit 1
          fi

      - name: Create the traffic App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TRAFFIC_APP_CLIENT_ID }}
          private-key: ${{ secrets.TRAFFIC_APP_PRIVATE_KEY }}
          permission-administration: read

      - name: Fetch GitHub traffic API data
        id: fetch
        env:
          TRAFFIC_API_TOKEN: ${{ steps.app-token.outputs.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
        run: |
          set -euo pipefail
          echo "collected_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          RAW="$RUNNER_TEMP/traffic-raw"
          echo "RAW=$RAW" >> "$GITHUB_ENV"
          mkdir -p "$RAW"
          # Any failure stops the run before the history is touched.
          fetch() {
            curl --silent --show-error --location --fail-with-body \
              --retry 5 --retry-max-time 300 --max-time 60 \
              --header "Authorization: Bearer $TRAFFIC_API_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --output "$RAW/$1.json" "$API$2" \
              || { echo "::error::API request for $1 failed"; exit 1; }
          }
          fetch views "/traffic/views?per=day"
          fetch clones "/traffic/clones?per=day"
          fetch referrers /traffic/popular/referrers
          fetch paths /traffic/popular/paths
          fetch repo ""

      - name: Merge into the history
        env:
          COLLECTED_AT: ${{ steps.fetch.outputs.collected_at }}
        run: python source/tools/traffic_history.py merge --raw "$RAW" --data history/data --collected-at "$COLLECTED_AT"

      - name: Commit traffic history
        working-directory: history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add data/
          if git diff --cached --quiet; then
            echo "No traffic changes to commit"
          else
            git commit -q -m "Update traffic history"
          fi
          # Ephemeral helper: no credential is persisted in Git configuration.
          git -c credential.helper= \
            -c 'credential.helper=!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f' \
            push origin HEAD:traffic-history

  alert:
    name: Traffic alert
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # No environment: this job never receives the App's key or token.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false

      - name: Check out traffic-history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: traffic-history
          path: history
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.18"

      - name: Open the alert issue, if one is due
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The active milestone: the open one with the earliest due date after
          # today (UTC), as the metadata workflow chooses it. Checked before any
          # early exit, so a missing due date fails every run, not only one with
          # an alert. `// empty` prints nothing when there is none.
          titles="$(TODAY="$(date -u +%F)" gh api --paginate \
            "repos/$GH_REPO/milestones?state=open&sort=due_on&direction=asc&per_page=100" \
            --jq '.[] | select(.due_on != null and .due_on[0:10] > env.TODAY) | .title')"
          milestone="${titles%%$'\n'*}"
          if [ -z "$milestone" ]; then
            echo "::error::No open milestone is due after today; give the active milestone a due date"
            exit 1
          fi
          alert="$RUNNER_TEMP/alert.json"
          python source/tools/traffic_history.py alert --data history/data --output "$alert"
          [ -f "$alert" ] || exit 0
          title="$(jq -r .title "$alert")"
          jq -j .body "$alert" > "$RUNNER_TEMP/alert.md"
          existing="$(gh issue list --state all --search "\"$title\" in:title" \
            --json title --jq "map(select(.title == \"$title\")) | length")"
          if [ "$existing" != "0" ]; then
            echo "Alert issue already exists for $title"
            exit 0
          fi
          gh issue create --title "$title" --body-file "$RUNNER_TEMP/alert.md" \
            --assignee danielep71 --label P3 --label repository --milestone "$milestone"
