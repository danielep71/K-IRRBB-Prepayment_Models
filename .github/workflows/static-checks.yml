name: Repository integrity
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every branch, so the Dependabot target can be checked below.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.18"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          package-manager-cache: false
      - name: Install hash-locked quality tools
        run: |
          python -m venv .venv-quality
          .venv-quality/bin/python -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: -r tools/requirements-quality-ci.txt
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - name: Check repository and automation regressions
        run: |
          mkdir -p test-results
          set -o pipefail
          {
            printf 'Source commit: %s\n' "$GITHUB_SHA"
            python --version
            node --version
            .venv-quality/bin/python -m pip freeze
            .venv-quality/bin/python tools/quality.py
          } 2>&1 | tee test-results/integrity.txt
      - name: Check the changelog and VERSION
        # The link references must point to this repository.
        run: python tools/check_changelog.py --repository "$GITHUB_REPOSITORY"
      - name: Check that Dependabot targets an existing branch
        run: |
          # fetch-depth: 0 fetched every branch, so each target is a remote-tracking ref.
          # The targets are read with the YAML parser, so quoting and comments do not matter.
          .venv-quality/bin/python tools/check_config.py --dependabot-targets > "$RUNNER_TEMP/dependabot-targets"
          failed=0
          while read -r branch; do
            if ! git rev-parse --verify --quiet "refs/remotes/origin/${branch}" > /dev/null; then
              echo "::error file=.github/dependabot.yml::target-branch ${branch} does not exist; set it to the active release branch."
              failed=1
            fi
          done < "$RUNNER_TEMP/dependabot-targets"
          exit "$failed"
      # One report per run and attempt, kept 30 days; uploaded even when a step
      # fails, and the upload fails if the report was never written.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integrity-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/integrity.txt
          if-no-files-found: error
          retention-days: 30

  minimum-python:
    # Not a required check: it runs the offline checks on the minimum Python
    # version that INSTALLATION.md documents, which needs no packages.
    name: Minimum Python (3.10)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10.22"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          package-manager-cache: false
      - name: Run the offline checks
        run: |
          python --version
          node --version
          python tools/check.py
