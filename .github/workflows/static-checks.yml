name: Repository integrity
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned quality tools
        run: |
          python3 -m venv .venv-quality
          .venv-quality/bin/python -m pip install --disable-pip-version-check -r tools/requirements-quality-ci.txt
          curl --fail --location --retry 3 https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/actionlint-bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint-bin" actionlint
          echo "$RUNNER_TEMP/actionlint-bin" >> "$GITHUB_PATH"
      - name: Check repository and automation regressions
        run: |
          mkdir -p test-results
          set -o pipefail
          {
            printf 'Source commit: %s\n' "$GITHUB_SHA"
            python3 --version
            node --version
            .venv-quality/bin/python -m pip freeze
            .venv-quality/bin/python tools/quality.py
          } 2>&1 | tee test-results/integrity.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: repository-integrity
          path: test-results/
          retention-days: 14
