<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">K-IRRBB Prepayment Models — repository setup</title>
  <desc id="desc">Planned Excel/VBA toolkit for loan-prepayment assumptions and independent challenge. Partial and full prepayments, CPR/SMM conventions, scenarios and synthetic benchmarks are planned scope, not implemented or validated results.</desc>
  <defs>
    <linearGradient id="bg"><stop stop-color="#060d1a"/><stop offset="1" stop-color="#111d3b"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#009de0"/><stop offset="1" stop-color="#9659ee"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#5635ad" stop-opacity=".38"/><stop offset="1" stop-color="#111d3b" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#89b4f2" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="570" width="710" height="640" fill="url(#grid)"/>
  <ellipse cx="980" cy="310" rx="450" ry="350" fill="url(#glow)"/>
  <g font-family="DejaVu Sans, sans-serif">
    <rect x="64" y="54" width="78" height="78" rx="14" fill="#0c1830" stroke="#009de0" stroke-width="2"/>
    <text x="103" y="89" text-anchor="middle" fill="#fff" font-size="24" font-weight="bold">VBA</text>
    <text x="103" y="117" text-anchor="middle" fill="#54c7ff" font-size="23" font-family="DejaVu Sans Mono, monospace">{ }</text>
    <path d="M166 78h65 M166 94h99 M166 110h80" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
    <text x="64" y="226" font-family="DejaVu Sans, sans-serif" font-stretch="condensed" font-size="87" font-weight="bold" letter-spacing="-4" fill="#fff">K-IRRBB</text>
    <text x="66" y="292" font-size="43" font-weight="bold" letter-spacing="1" fill="#45bcf5">PREPAYMENT</text>
    <text x="66" y="345" font-size="43" font-weight="bold" letter-spacing="1" fill="#be9aff">MODELS</text>
    <text x="67" y="400" font-size="21" fill="#c6d3e8">Loan-prepayment assumptions.</text>
    <text x="67" y="432" font-size="21" fill="#c6d3e8">Transparent, independent challenge.</text>
    <rect x="66" y="475" width="269" height="42" rx="8" fill="#101e37" stroke="#45bcf5"/>
    <text x="200" y="502" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1" fill="#73d0ff">REPOSITORY SETUP</text>
    <text x="66" y="558" font-size="16" fill="#a1b5d2">Planned toolkit · Excel / VBA · IRRBB / ALM</text>
    <g transform="translate(648 60)">
      <text x="0" y="15" font-size="13" font-weight="bold" letter-spacing="2.6" fill="#a9bddc">PLANNED SCOPE</text>
      <path d="M0 37H560" stroke="url(#accent)" stroke-width="3"/>
      <g transform="translate(0 60)">
        <rect width="560" height="127" rx="12" fill="#0f203a" stroke="#34537a"/>
        <rect x="0" y="16" width="4" height="95" rx="2" fill="#009de0"/>
        <text x="24" y="40" fill="#56c8fc" font-family="DejaVu Sans Mono, monospace" font-size="14">01 / LOAN BEHAVIOUR</text>
        <text x="24" y="78" fill="#fff" font-size="27" font-weight="bold">Partial + full prepayments</text>
        <text x="24" y="106" fill="#a9bddc" font-size="16">Separate early repayments from scheduled principal</text>
      </g>
      <g transform="translate(0 204)">
        <rect width="560" height="127" rx="12" fill="#111e3b" stroke="#43517d"/>
        <rect x="0" y="16" width="4" height="95" rx="2" fill="#7266e8"/>
        <text x="24" y="40" fill="#b9aaff" font-family="DejaVu Sans Mono, monospace" font-size="14">02 / MODEL ASSUMPTIONS</text>
        <text x="24" y="78" fill="#fff" font-size="27" font-weight="bold">CPR / SMM + scenarios</text>
        <text x="24" y="106" fill="#a9bddc" font-size="16">Explicit conventions, segments and rate incentives</text>
      </g>
      <g transform="translate(0 348)">
        <rect width="560" height="127" rx="12" fill="#191d3c" stroke="#554779"/>
        <rect x="0" y="16" width="4" height="95" rx="2" fill="#9659ee"/>
        <text x="24" y="40" fill="#c9a5ff" font-family="DejaVu Sans Mono, monospace" font-size="14">03 / INDEPENDENT CHALLENGE</text>
        <text x="24" y="78" fill="#fff" font-size="27" font-weight="bold">Synthetic benchmarks</text>
        <text x="24" y="106" fill="#a9bddc" font-size="16">Backtesting, tolerances and reproducible evidence</text>
      </g>
      <text x="0" y="511" fill="#a9bddc" font-size="15">No model, workbook or validated outputs delivered yet.</text>
    </g>
    <path d="M64 595H1210" stroke="#28405e"/>
    <text x="64" y="621" fill="#869fbe" font-size="12" letter-spacing="1.4">K-RISK-ENGINES</text>
    <text x="1210" y="621" text-anchor="end" fill="#869fbe" font-size="12">Loan prepayments · Behavioural modelling</text>
  </g>
</svg>
